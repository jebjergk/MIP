title: Bracket orders
plain_language_explanation: >
  A bracket order groups an entry with protective exits — typically a take-profit and
  stop-loss — so risk is bounded around the entry fill.
deeper_explanation: >
  Brokers may model brackets as OCA (one-cancels-all) children. MIP live realism settings
  affect how proposals map to bracket constraints.
related_mip_concepts:
  - Live portfolio config and viability checks
examples:
  - Buy stock with stop 5% below and target 8% above entry
cautions:
  - General markets education; IBKR-specific behavior may differ by product.
