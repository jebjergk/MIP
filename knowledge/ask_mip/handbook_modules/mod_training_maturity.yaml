module_id: training_maturity
title: Training maturity and evidence depth
concept_summary: >
  Maturity stages summarize how much historical evidence supports relying on a pattern
  for downstream trading workflows — they are research-quality gauges, not price forecasts.
why_it_matters: >
  Acting before maturity is sufficient increases variance; maturity complements trust gates
  and committee review.
