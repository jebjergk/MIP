    section_title: Status grid
    purpose: Tabular training metrics per symbol/pattern.
    widget_ids:
      - training_status_grid
    typical_user_questions:
      - What does trust gate mean?
      - Is higher sample count better?
linked_pages:
  - route: /symbol-tracker
    page_id: symbol_tracker
refresh_behavior: Loaded on page open; user refreshes browser to pull latest.
dependencies:
  - /training/status API
caveats:
  - Training metrics are historical pipeline outputs; they do not replace live risk checks.
