rule_logic: >
  Derived from committee posture, live state heuristics, and client-side helpers.
  Exact numeric thresholds are not fully documented in public artifacts.
thresholds: See in-app committee and exit helper; do not invent coefficients.
dependencies:
  - committee_stance
  - live session state
example_trigger_scenarios:
  - Committee escalates while position is open
  - Flow quality degrades with adverse move
common_misunderstandings:
